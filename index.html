<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOT - Scope OSINT Training</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="assets/highlight-atom-one-dark.min.css">
  <link rel="stylesheet" href="styles/criminology.css">
</head>
<body>
  <div class="app-container" id="app">

    <header class="titlebar">
      <div class="titlebar-left">
        <div class="titlebar-brand">
          <div class="titlebar-logo" id="titlebarLogo">
            <svg width="22" height="22" viewBox="0 0 128 128" fill="none" stroke="currentColor" stroke-width="1.5">
              <filter id="logoFilter">
                <feTurbulence type="turbulence" numOctaves="2" baseFrequency="0" result="turbulence"/>
                <feDisplacementMap in2="turbulence" in="SourceGraphic" scale="1" xChannelSelector="R" yChannelSelector="G"/>
              </filter>
              <polygon id="logoHexagon" points="64 128 8.574 96 8.574 32 64 0 119.426 32 119.426 96" fill="currentColor"/>
            </svg>
          </div>
          <span class="titlebar-title">SOT - Scope OSINT Training</span>
        </div>
      </div>
      <div class="titlebar-controls">
        <button class="titlebar-btn minimize" aria-label="Minimize">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>

        <button class="titlebar-btn close" aria-label="Close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="20.59 7.23 14.86 7.23 14.86 1.5 12 2.46 9.14 1.5 9.14 7.23 3.41 7.23 4.36 10.09 3.41 12.96 9.14 12.96 9.14 22.5 12 21.55 14.86 22.5 14.86 12.96 20.59 12.96 19.64 10.09 20.59 7.23"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="app-body">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-inner">
            <div class="sidebar-top">
              <div class="nav-item" data-label="Home">
                <span class="nav-icon">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                  </svg>
                </span>
                <span class="nav-label">Home</span>
              </div>
              <div class="nav-item" data-label="AI Agent">
                <span class="nav-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 8V4H8"/>
                    <rect width="16" height="12" x="4" y="8" rx="2"/>
                    <path d="M2 14h2"/>
                    <path d="M20 14h2"/>
                    <path d="M15 13v2"/>
                    <path d="M9 13v2"/>
                  </svg>
                </span>
                <span class="nav-label">AI Agent</span>
              </div>
              <div class="nav-item" data-label="Chat history">
                <span class="nav-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z"/>
                  </svg>
                </span>
                <span class="nav-label">Chat history</span>
              </div>
              <div class="nav-item" data-label="Documents of Criminology">
                <span class="nav-icon">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="10" y1="13" x2="14" y2="13"/>
                    <line x1="10" y1="17" x2="14" y2="17"/>
                  </svg>
                </span>
                <span class="nav-label">Documents of Criminology</span>
              </div>
              <div class="nav-item" data-label="Documents of OSINT">
                <span class="nav-icon">
                  <!-- Icon: BookStack by Simple Icons — <a href="https://icon-icons.com/ru/authors/235-simpleicon">Icon-Icons.com</a> -->
                  <svg role="img" width="22" height="22" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
                    <path d="M.3013 17.6146c-.1299-.3387-.5228-1.5119-.1337-2.4314l9.8273 5.6738a.329.329 0 0 0 .3299 0L24 12.9616v2.3542l-13.8401 7.9906-9.8586-5.6918zM.1911 8.9628c-.2882.8769.0149 2.0581.1236 2.4261l9.8452 5.6841L24 9.0823V6.7275L10.3248 14.623a.329.329 0 0 1-.3299 0L.1911 8.9628zm13.1698-1.9361c-.1819.1113-.4394.0015-.4852-.2064l-.2805-1.1336-2.1254-.1752a.33.33 0 0 1-.1378-.6145l5.5782-3.2207-1.7021-.9826L.6979 8.4935l9.462 5.463 13.5104-7.8004-4.401-2.5407-5.9084 3.4113zm-.1821-1.7286.2321.938 5.1984-3.0014-2.0395-1.1775-4.994 2.8834 1.3099.108a.3302.3302 0 0 1 .2931.2495zM24 9.845l-13.6752 7.8954a.329.329 0 0 1-.3299 0L.1678 12.0667c-.3891.919.003 2.0914.1332 2.4311l9.8589 5.692L24 12.1993V9.845z"/>
                  </svg>
                </span>
                <span class="nav-label">Documents of OSINT</span>
              </div>
            </div>
          <div class="sidebar-spacer"></div>
          <div class="sidebar-settings">
            <div class="sidebar-divider"></div>
            <div class="nav-item" data-label="Settings">
              <span class="nav-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="4" y1="6" x2="20" y2="6"/>
                  <line x1="4" y1="12" x2="20" y2="12"/>
                  <line x1="4" y1="18" x2="20" y2="18"/>
                  <circle cx="8" cy="6" r="2"/>
                  <circle cx="14" cy="12" r="2"/>
                  <circle cx="10" cy="18" r="2"/>
                </svg>
              </span>
              <span class="nav-label">Settings</span>
            </div>
            <div class="nav-item" data-label="Support">
              <span class="nav-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
                  <path d="M9.1 9a3 3 0 0 1 5.82 1c0 2-3 3-3 3"/>
                  <path d="M12 17h.01"/>
                </svg>
              </span>
              <span class="nav-label">Support</span>
            </div>
            <div class="sidebar-divider"></div>
          </div>
          <div class="sidebar-bottom">
            <div class="user-profile" data-label="Profile">
              <div class="avatar" id="sidebarAvatar">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21 V19 A4 4 0 0 0 16 15 H8 A4 4 0 0 0 4 19 V21"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
              </div>
              <div class="user-info">
                <span class="username" id="sidebarUsername">CyberPunk</span>
                <span class="email" id="sidebarEmail">user@sot.app</span>
              </div>
            </div>
          </div>
        </div>
      </aside>

      <main class="content" id="content">
      </main>
    </div>
  </div>

  <script src="./node_modules/animejs/dist/bundles/anime.umd.min.js"></script>
  <script src="./node_modules/marked/lib/marked.umd.js"></script>
  <script src="assets/highlight.min.js"></script>
  <script src="./node_modules/mermaid/dist/mermaid.min.js"></script>
  <script type="module" src="src/renderer/app.js"></script>
</body>
</html>
